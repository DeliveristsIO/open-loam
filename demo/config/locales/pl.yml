      notifications: "Powiadomienia"
      api_tokens: "Tokeny API"
      security: "Bezpieczeństwo"
      approvals: "Zatwierdzenia"
      settings: "Ustawienia"
      features: "Funkcje"
      rules: "Reguły"
      sso: "SSO"
      dictionaries: "Słowniki"
      tasks: "Zadania"
      schedules: "Harmonogramy"
      deliveries: "Dostawy"
      inbound: "Przychodzące"
      api_docs: "Dokumentacja API"
      overrides: "Nadpisania"
    actions:
      new: "Nowy: %{name}"
      new_title: "Nowy: %{name}"
      edit_title: "Edytuj %{name} #%{id}"
      show_title: "%{name} #%{id}"
      deleted_title: "Usunięte: %{name}"
      show: "Pokaż"
