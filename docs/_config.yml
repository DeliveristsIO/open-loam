title: Loam
description: AI-native Rails business foundation — tenancy, policies, audit, events, admin — decided, not re-litigated.
url: https://deliveristsio.github.io
baseurl: "/open-loam"
lang: en-US
timezone: UTC

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: pretty

theme: jekyll-vitepress-theme

collections:
  guides:
    output: true
    permalink: "/:name/"
  agents:
    output: true
    permalink: "/agents/:name/"
  adr:
    output: true
    permalink: "/adr/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      type: guides
    values:
      layout: default
  - scope:
      type: agents
    values:
      layout: default
  - scope:
      type: adr
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    publisher:
      type: Organization
      name: Loam
      url: https://deliveristsio.github.io/open-loam
      same_as:
        - https://github.com/DeliveristsIO/open-loam
  llms:
    title: Loam
    description: >-
      Documentation for Loam, the AI-native Rails business foundation: multi-tenancy,
      roles and field-level permissions, audit trails, a domain event bus, and an
      admin surface — decided, not re-litigated.
    full: true
    details: >-
      Start with Getting Started, then Concept and Architecture for the design.
      Agent Deep-Dives cover the subsystems with sharp edges, and Architecture
      Decisions record why each call was made. Source is on
      [GitHub](https://github.com/DeliveristsIO/open-loam).
  branding:
    site_title: Loam
  syntax:
    light_theme: github
    dark_theme: github.dark
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%-d %b %Y"
  edit_link:
    enabled: true
    pattern: "https://github.com/DeliveristsIO/open-loam/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: DeliveristsIO/open-loam
    text: Star
    show_count: true
  labels:
    outline: On this page
    sidebar_menu: Menu
    return_to_top: Return to top
    skip_to_content: Skip to content
    appearance_menu: Appearance
    switch_to_dark: Switch to dark theme
    switch_to_light: Switch to light theme

plugins:
  - jekyll-vitepress-theme
