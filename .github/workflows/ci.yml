name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The gem's own harness. It builds real Rails apps in a temp dir and drives
  # the generators through them, shelling out to the globally installed `rails`
  # from inside Bundler.with_unbundled_env — so rails has to be installed with
  # `gem install`, not through Bundler. A bundler-cached install lands in
  # vendor/bundle, which the unbundled environment cannot see.
  gem:
    name: Generator harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      # rake and minitest ship with Ruby as bundled gems; naming them anyway
      # keeps the harness working if a future Ruby unbundles one.
      - name: Install Rails
        run: gem install rails rake minitest --no-document

      - name: Run harness
        run: rake test

  demo:
    name: Demo app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v7

      # working-directory points setup-ruby at demo/.ruby-version and
      # demo/Gemfile.lock. The `loam` gem resolves through `path: ".."`, which
      # the checkout already provides.
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: demo
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:migrate db:seed

      - name: Run tests
        run: bin/rails test

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: docs
          bundler-cache: true

      - name: Set up Pages
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Build docs
        run: |
          if [ -n "${PAGES_BASE_PATH}" ]; then
            bundle exec jekyll build --baseurl "${PAGES_BASE_PATH}"
          else
            bundle exec jekyll build
          fi
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy_docs:
    name: Deploy docs
    needs: [docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
