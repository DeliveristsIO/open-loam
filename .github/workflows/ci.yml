name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; the one job that needs more asks for it locally.
permissions:
  contents: read

jobs:
  # The gem's own harness. It builds real Rails apps in a temp dir and drives
  # the generators through them, shelling out to the globally installed `rails`
  # from inside Bundler.with_unbundled_env — so rails has to be installed with
  # `gem install`, not through Bundler. A bundler-cached install lands in
  # vendor/bundle, which the unbundled environment cannot see.
  gem:
    name: Generator harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      # rake and minitest ship with Ruby as bundled gems; naming them anyway
      # keeps the harness working if a future Ruby unbundles one.
      - name: Install Rails
        run: gem install rails rake minitest --no-document

      - name: Run harness
        run: rake test

  demo:
    name: Demo app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v7

      # working-directory points setup-ruby at demo/.ruby-version and
      # demo/Gemfile.lock. The `open_loam` gem resolves through `path: ".."`, which
      # the checkout already provides.
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: demo
          bundler-cache: true

      - name: Lint (Rubocop)
        run: bin/rubocop

      # The gem is where the security-relevant code lives, and it is a Rails
      # engine, so scanning only demo/ left its app/ and lib/ unanalyzed —
      # which is how a SQL-injection-shaped fragment and an unvalidated
      # outbound URL sat unnoticed. --add-engines-path pulls in app/,
      # --add-libs-path the plain Ruby under lib/.
      - name: Security scan (Brakeman)
        run: bin/brakeman -q --add-engines-path .. --add-libs-path ../lib --ensure-ignore-notes --ensure-no-obsolete-ignore-entries

      - name: Prepare database
        run: bin/rails db:migrate db:seed

      - name: Run tests
        run: bin/rails test

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          working-directory: docs
          bundler-cache: true

      # Fails with a 404 until Pages is enabled in repo settings (Settings →
      # Pages → Source: GitHub Actions) — continue-on-error so that's a soft
      # skip, not a red build, until someone flips it on.
      - name: Set up Pages
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Build docs
        run: |
          if [ -n "${PAGES_BASE_PATH}" ]; then
            bundle exec jekyll build --baseurl "${PAGES_BASE_PATH}"
          else
            bundle exec jekyll build
          fi
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}

  deploy_docs:
    name: Deploy docs
    needs: [docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.docs.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
