name: Release

# Publishing is triggered by the version tag, so the whole release ritual is:
# bump lib/loam/version.rb, commit, `git tag -a vX.Y.Z`, `git push --follow-tags`.
#
# No API key is involved anywhere. rubygems/release-gem exchanges GitHub's OIDC
# token for short-lived RubyGems credentials (trusted publishing), which is why
# `id-token: write` below is load-bearing rather than boilerplate — without it
# the action cannot identify itself and the publish fails.
#
# Set up once at rubygems.org → gem → trusted publishers, naming this
# repository, `release.yml`, and the `release` environment.

on:
  push:
    tags:
      - "v*"

jobs:
  # ci.yml runs on pushes to main, but a tag can point at any commit, and a
  # gem version can never be re-pushed once it is published. So the harness
  # runs again against exactly what is about to ship.
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      # Same reasoning as ci.yml: the harness shells out to a globally
      # installed `rails` from inside Bundler.with_unbundled_env, so rails
      # cannot come from a bundle.
      - name: Install Rails
        run: gem install rails rake minitest --no-document

      - name: Run harness
        run: rake test

  push:
    name: Push gem to RubyGems.org
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      # Trusted publishing. This is the credential.
      id-token: write
      # `rake release` wants to push the version tag. It is already pushed —
      # pushing it is what started this run — so Bundler skips that step, but
      # the task still expects write access.
      contents: write

    # Must match the environment named on the trusted publisher. Any approval
    # rules configured on this environment gate the publish.
    environment: release

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - uses: rubygems/release-gem@v1
